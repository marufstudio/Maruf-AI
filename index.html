<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maruf AI — MarufVision</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<style>
  :root{--bg:#07070d;--violet:#7c5cff;--ice:#8fd3ff;--paper:#f6f7fb}
  body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:#eef0f7;margin:0}
  .display{font-family:'Sora',system-ui,sans-serif}
  .hidden{display:none!important}
  .view{min-height:100vh}
  /* Home */
  .stage{position:relative;height:100vh;min-height:600px;overflow:hidden;
    background:radial-gradient(70% 50% at 50% 70%,rgba(124,92,255,.35),transparent 70%),linear-gradient(#07070d 60%,#10101c 60.2%,#050509)}
  .stage::after{content:"";position:absolute;left:0;right:0;top:60%;height:1px;background:linear-gradient(90deg,transparent,var(--ice),var(--violet),transparent);box-shadow:0 0 30px 3px rgba(124,92,255,.7)}
  #hero-canvas{position:absolute;inset:0;width:100%;height:100%;cursor:grab;touch-action:pan-y}
  #watermark{position:absolute;left:50%;top:42%;font-size:clamp(5rem,24vw,23rem);font-weight:800;letter-spacing:-.06em;line-height:1;white-space:nowrap;pointer-events:none;user-select:none;color:transparent;background:linear-gradient(#ffffff1f,transparent 85%);-webkit-background-clip:text;background-clip:text;transform:translate(-50%,-50%)}
  .cta{background:linear-gradient(135deg,var(--violet),var(--ice));color:#07070d;font-weight:700;box-shadow:0 10px 40px -8px rgba(124,92,255,.8);transition:transform .2s}
  .cta:hover{transform:translateY(-2px)}
  /* Login */
  .login-art{background:radial-gradient(80% 60% at 50% 50%,rgba(124,92,255,.35),transparent 70%),#07070d}
  .paper{background:var(--paper);color:#12121c}
  /* App */
  .side{background:#0d0d17;border-right:1px solid #1d1d2c}
  .tool{display:flex;align-items:center;gap:.7rem;width:100%;padding:.7rem .9rem;border-radius:12px;color:#a8adc4;font-size:.9rem;font-weight:500;transition:.15s;text-align:left}
  .tool:hover{background:#171726;color:#fff}
  .tool[aria-pressed="true"]{background:linear-gradient(135deg,rgba(124,92,255,.3),rgba(143,211,255,.15));color:#fff;box-shadow:inset 0 0 0 1px rgba(143,211,255,.35)}
  .bubble-user{background:#12121c;color:#fff;border-radius:18px 18px 4px 18px}
  .bubble-ai{background:#fff;color:#1b1d2b;border:1px solid #e3e5ef;border-radius:18px 18px 18px 4px}
  .dots span{display:inline-block;width:6px;height:6px;margin:0 2px;border-radius:50%;background:#8b90a8;animation:b 1s infinite}
  .dots span:nth-child(2){animation-delay:.15s}.dots span:nth-child(3){animation-delay:.3s}
  @keyframes b{0%,80%,100%{transform:translateY(0);opacity:.4}40%{transform:translateY(-5px);opacity:1}}
  :focus-visible{outline:2px solid var(--ice);outline-offset:2px}
</style>
</head>
<body>

<!-- 1. HOME (public) -->
<main id="view-home" class="view">
  <section class="stage">
    <div id="watermark" class="display" aria-hidden="true">MarufAI</div>
    <canvas id="hero-canvas" aria-label="3D hardware core. Drag to rotate, click to pulse."></canvas>
    <header class="absolute top-0 inset-x-0 z-10 flex items-center justify-between px-5 sm:px-10 py-5">
      <div class="display text-lg font-bold">Maruf<span style="color:var(--ice)">Vision</span></div>
      <button class="free-chat-btn rounded-full border border-white/25 px-5 py-2 text-sm font-semibold hover:bg-white hover:text-black transition">Free Chat</button>
    </header>
    <div class="absolute z-10 inset-x-0 bottom-[8vh] text-center px-6 pointer-events-none">
      <h1 class="display text-3xl sm:text-5xl font-extrabold tracking-tight">Ask, imagine, search, delegate.</h1>
      <p class="mt-3 text-white/60 max-w-lg mx-auto text-sm sm:text-base">Drag the core to turn it. Sign in once and your AI workspace opens.</p>
      <button class="free-chat-btn cta pointer-events-auto mt-6 rounded-full px-8 py-3.5">Start Free Chat</button>
    </div>
  </section>
</main>

<!-- 2. LOGIN (gate) -->
<main id="view-login" class="view hidden">
  <div class="grid md:grid-cols-2 min-h-screen">
    <div class="login-art hidden md:flex flex-col items-center justify-center p-10">
      <canvas id="login-orb" class="w-full max-w-md aspect-square" aria-hidden="true"></canvas>
      <p class="display text-2xl font-bold mt-2 text-center">Your AI, one sign-in away.</p>
    </div>
    <div class="paper flex items-center justify-center p-6">
      <div class="w-full max-w-sm">
        <button id="back-home" class="text-sm text-slate-500 hover:text-slate-900 mb-10">&larr; Back to home</button>
        <h2 class="display text-3xl font-extrabold tracking-tight">Sign in to chat</h2>
        <p class="mt-2 text-slate-600 text-sm">Use your Google account. The chat opens right after you sign in.</p>
        <button id="google-btn" class="mt-8 w-full flex items-center justify-center gap-3 rounded-xl bg-white border border-slate-300 py-3.5 font-semibold hover:shadow-md transition">
          <svg width="20" height="20" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9 3.6l6.7-6.7C35.6 2.4 30.2 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.8 6.1C12.3 13.5 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.5 5.8c4.4-4.1 7.1-10.1 7.1-17.5z"/><path fill="#FBBC05" d="M10.4 28.7A14.5 14.5 0 0 1 9.5 24c0-1.6.3-3.2.9-4.7l-7.8-6.1A24 24 0 0 0 0 24c0 3.9.9 7.5 2.6 10.8l7.8-6.1z"/><path fill="#34A853" d="M24 48c6.2 0 11.4-2 15.2-5.5l-7.5-5.8c-2 1.4-4.7 2.3-7.7 2.3-6.3 0-11.7-4-13.6-9.8l-7.8 6.1C6.5 42.6 14.6 48 24 48z"/></svg>
          Continue with Google
        </button>
        <p id="login-error" class="mt-4 text-sm text-red-600" role="alert"></p>
      </div>
    </div>
  </div>
</main>

<!-- 3. APP (protected) -->
<main id="view-app" class="view hidden">
  <div class="flex h-screen">
    <aside class="side hidden md:flex w-64 flex-col p-4">
      <div class="display text-lg font-bold px-2 mb-6">Maruf<span style="color:var(--ice)">Vision</span></div>
      <nav class="space-y-1" aria-label="Tools">
        <button class="tool" data-mode="chat" aria-pressed="true">Smart Chat</button>
        <button class="tool" data-mode="imagine" aria-pressed="false">Imagine</button>
        <button class="tool" data-mode="search" aria-pressed="false">Search the Web</button>
        <button class="tool" data-mode="agent" aria-pressed="false">Agent Mode</button>
      </nav>
      <div class="mt-auto border-t border-white/10 pt-4">
        <div id="user-name" class="text-sm font-semibold truncate"></div>
        <div id="user-email" class="text-xs text-white/50 truncate"></div>
        <button id="logout-btn" class="mt-3 w-full rounded-lg border border-white/20 py-2 text-sm hover:bg-white hover:text-black transition">Log out</button>
      </div>
    </aside>

    <section class="paper flex-1 flex flex-col min-w-0">
      <header class="flex items-center justify-between gap-3 px-4 sm:px-6 py-3 border-b border-slate-200 bg-white">
        <div class="flex items-center gap-3 min-w-0">
          <canvas id="app-orb" class="w-12 h-12 shrink-0" aria-hidden="true"></canvas>
          <div class="min-w-0"><div class="display font-bold leading-tight">Maruf AI</div><div id="mode-hint" class="text-xs text-slate-500 truncate"></div></div>
        </div>
        <div class="md:hidden flex items-center gap-2">
          <select id="mode-select" class="rounded-lg border border-slate-300 bg-white text-sm py-1.5 px-2" aria-label="Tool">
            <option value="chat">Smart Chat</option><option value="imagine">Imagine</option><option value="search">Search</option><option value="agent">Agent</option>
          </select>
          <button id="logout-btn-m" class="rounded-lg bg-[#12121c] text-white text-sm px-3 py-1.5">Log out</button>
        </div>
      </header>

      <div id="chat" class="flex-1 overflow-y-auto px-4 sm:px-8 py-6 space-y-3" role="log" aria-live="polite"></div>

      <div class="px-4 sm:px-8 pb-5">
        <div class="flex items-end gap-2 rounded-2xl bg-white border border-slate-300 p-2 focus-within:border-[#7c5cff]">
          <textarea id="input" rows="1" class="flex-1 resize-none bg-transparent px-2 py-2 text-sm outline-none max-h-32" placeholder="Message Maruf AI" aria-label="Message"></textarea>
          <button id="send" class="rounded-xl cta px-5 py-2.5 text-sm">Send</button>
        </div>
      </div>
    </section>
  </div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="script.js"></script>
</body>
</html>
